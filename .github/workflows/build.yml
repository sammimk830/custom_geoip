name: Build Custom geoip.dat

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 20 * * *'  # 每天香港時間 04:00 自動更新
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 確保 Actions 有權限發布 Release
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Get current timestamp (HKT)
        id: time
        run: |
          echo "TIMESTAMP=$(TZ='Asia/Hong_Kong' date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Process & Extract IP Rules (Python)
        run: python convert.py

      - name: Compile and Merge with Base MMDB using v2fly Tool
        run: |
          git clone --depth 1 https://github.com/v2fly/geoip.git compiler
          
          # 將自訂 data/ 資料夾複製到編譯器目錄
          cp -r data compiler/
          
          # 如果成功下載了 base.mmdb，也複製過去供編譯器合併
          if [ -f "base.mmdb" ]; then
            cp base.mmdb compiler/
          fi
          
          cd compiler
          
          # 呼叫官方編譯工具 (如果存在 base.mmdb 會自動作為基礎合併)
          if [ -f "base.mmdb" ]; then
            go run ./ --input ./data --base ./base.mmdb --output ./output
          else
            go run ./ --input ./data --output ./output
          fi
          
          if [ -f "output/geoip.dat" ]; then
            mv output/geoip.dat ../geoip.dat
            sha256sum ../geoip.dat | awk '{print $1}' > ../geoip.dat.sha256sum
          fi

      # Step 1: 建立帶時間戳記的獨立歷史 Release (例如 Tag: 20260802160842)
      - name: Release geoip.dat (Timestamp)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.time.outputs.TIMESTAMP }}
          name: "${{ steps.time.outputs.TIMESTAMP }}"
          body: "Auto-built geoip.dat at ${{ steps.time.outputs.TIMESTAMP }}"
          draft: false
          prerelease: false
          files: |
            geoip.dat
            geoip.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: 同時更新固定標籤 (release)，供 Client 端用固定連結直連訂閱
      - name: Update Latest Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: "Latest Release"
          body: |
            Always contains the latest custom geoip.dat.
            
            Build time: ${{ steps.time.outputs.TIMESTAMP }} HKT
          draft: false
          prerelease: false
          files: |
            geoip.dat
            geoip.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
