name: Build Custom geoip.dat

on:
  push:
    branches:
      - main
      - master

  schedule:
    - cron: "0 20 * * *" # 每日香港時間 04:00

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-custom-geoip
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install maxminddb

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: false

      - name: Get current timestamp (HKT)
        id: time
        shell: bash
        run: |
          set -euo pipefail

          echo "TIMESTAMP=$(TZ='Asia/Hong_Kong' date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Process and Extract IP Rules
        shell: bash
        run: |
          set -euo pipefail

          python convert.py

          if [ ! -d "data" ]; then
            echo "Error: convert.py did not create data directory."
            exit 1
          fi

          if [ -z "$(find data -maxdepth 1 -type f -print -quit)" ]; then
            echo "Error: no IP rule files were generated inside data."
            exit 1
          fi

          echo "Generated text rule files:"
          find data -maxdepth 1 -type f -print | sort

          echo "Generated Country MMDB files:"
          find . -maxdepth 1 -type f -name 'base-*.mmdb' -print | sort

      # ============================================================
      # Build full geoip.dat
      # ============================================================

      - name: Clone v2fly geoip compiler
        shell: bash
        run: |
          set -euo pipefail

          rm -rf compiler

          git clone \
            --depth 1 \
            https://github.com/v2fly/geoip.git \
            compiler

          echo "Compiler commit:"
          git -C compiler rev-parse HEAD

      - name: Copy source files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf compiler/data
          rm -rf compiler/mmdb

          cp -r data compiler/data
          mkdir -p compiler/mmdb

          MMDB_COUNT=0

          for mmdb_file in base-*.mmdb; do
            if [ ! -f "$mmdb_file" ]; then
              continue
            fi

            cp "$mmdb_file" compiler/mmdb/

            MMDB_COUNT=$((MMDB_COUNT + 1))

            echo "Copied Country MMDB: $mmdb_file"
          done

          echo "Total Country MMDB files copied: $MMDB_COUNT"

          if [ "$MMDB_COUNT" -eq 0 ]; then
            echo "Warning: no Country MMDB files were configured."
          fi

          echo "Compiler text inputs:"
          find compiler/data \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo "Compiler MMDB inputs:"
          find compiler/mmdb \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      - name: Create v2fly compiler config
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import glob
          import json
          import os

          inputs = []

          mmdb_files = sorted(
              glob.glob("compiler/mmdb/base-*.mmdb")
          )

          for mmdb_file in mmdb_files:
              relative_path = "./" + os.path.relpath(
                  mmdb_file,
                  start="compiler",
              ).replace("\\", "/")

              inputs.append({
                  "type": "maxmindMMDB",
                  "action": "add",
                  "args": {
                      "uri": relative_path
                  }
              })

          inputs.append({
              "type": "text",
              "action": "add",
              "args": {
                  "inputDir": "./data"
              }
          })

          compiler_config = {
              "input": inputs,
              "output": [
                  {
                      "type": "v2rayGeoIPDat",
                      "action": "output",
                      "args": {
                          "outputDir": "./output",
                          "outputName": "geoip.dat"
                      }
                  }
              ]
          }

          with open(
              "compiler/custom-config.json",
              "w",
              encoding="utf-8",
          ) as config_file:
              json.dump(
                  compiler_config,
                  config_file,
                  ensure_ascii=False,
                  indent=2,
              )

          print(
              f"Added {len(mmdb_files)} "
              "Country MMDB files."
          )
          PY

          echo "Compiler config:"
          cat compiler/custom-config.json

      - name: Compile and merge geoip.dat
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail

          rm -rf output
          mkdir -p output

          go mod download
          go run ./ -c custom-config.json

          if [ ! -f "output/geoip.dat" ]; then
            echo "Error: output/geoip.dat was not generated."

            find . \
              -maxdepth 3 \
              -type f \
              -print

            exit 1
          fi

          if [ ! -s "output/geoip.dat" ]; then
            echo "Error: output/geoip.dat is empty."
            exit 1
          fi

          mv output/geoip.dat ../geoip.dat

      - name: Verify geoip.dat
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "geoip.dat" ]; then
            echo "Error: geoip.dat does not exist."
            exit 1
          fi

          if [ ! -s "geoip.dat" ]; then
            echo "Error: geoip.dat is empty."
            exit 1
          fi

          echo "Generated geoip.dat:"
          ls -lh geoip.dat

          sha256sum geoip.dat \
            | tee geoip.dat.sha256sum

      # ============================================================
      # Read SRS / MRS whitelist from config.json
      # ============================================================

      - name: Prepare selected rule-set sources
        id: rulesets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ruleset-source
          mkdir -p ruleset-source/srs
          mkdir -p ruleset-source/mrs
          mkdir -p ruleset-source/surge

          python <<'PY'
          import ipaddress
          import json
          import os
          import re
          from pathlib import Path

          import maxminddb

          config = json.loads(
              Path("config.json").read_text(encoding="utf-8")
          )

          outputs = config.get("ruleset_outputs", {}) or {}

          if not isinstance(outputs, dict):
              raise TypeError(
                  "ruleset_outputs must be a JSON object"
              )

          def normalize_tags(value, field_name):
              if value is None:
                  return []

              if not isinstance(value, list):
                  raise TypeError(
                      f"{field_name} must be an array"
                  )

              tags = []
              seen = set()

              for item in value:
                  tag = str(item).strip().lower()

                  if not tag:
                      continue

                  if not re.fullmatch(r"[a-z0-9_-]+", tag):
                      raise ValueError(
                          f"Invalid rule-set tag: {tag}"
                      )

                  if tag not in seen:
                      seen.add(tag)
                      tags.append(tag)

              return tags

          srs_tags = normalize_tags(
              outputs.get("srs", []),
              "ruleset_outputs.srs",
          )
          mrs_tags = normalize_tags(
              outputs.get("mrs", []),
              "ruleset_outputs.mrs",
          )
          surge_tags = normalize_tags(
              outputs.get("surge", []),
              "ruleset_outputs.surge",
          )

          all_tags = list(dict.fromkeys(
              srs_tags + mrs_tags + surge_tags
          ))

          data_dir = Path("data")
          srs_source_dir = Path("ruleset-source/srs")
          mrs_source_dir = Path("ruleset-source/mrs")
          surge_source_dir = Path("ruleset-source/surge")

          country_mmdb_files = sorted(
              Path(".").glob("base-*.mmdb")
          )

          country_cache = {}

          def get_country_code(record):
              if not isinstance(record, dict):
                  return None

              candidates = [
                  record.get("country"),
                  record.get("registered_country"),
                  record.get("represented_country"),
              ]

              for candidate in candidates:
                  if isinstance(candidate, dict):
                      value = candidate.get("iso_code")

                      if isinstance(value, str) and value.strip():
                          return value.strip().lower()

              for key in (
                  "country_code",
                  "iso_code",
                  "code",
              ):
                  value = record.get(key)

                  if isinstance(value, str) and value.strip():
                      return value.strip().lower()

              return None

          def extract_country_cidrs(tag):
              if tag in country_cache:
                  return country_cache[tag]

              if not re.fullmatch(r"[a-z]{2}", tag):
                  return []

              if not country_mmdb_files:
                  return []

              cidrs = set()

              for mmdb_file in country_mmdb_files:
                  print(
                      f"Extracting country {tag.upper()} "
                      f"from {mmdb_file}"
                  )

                  with maxminddb.open_database(
                      str(mmdb_file)
                  ) as reader:
                      for network, record in reader:
                          country_code = get_country_code(record)

                          if country_code == tag:
                              cidrs.add(str(network))

              result = sorted(
                  cidrs,
                  key=lambda value: (
                      ipaddress.ip_network(value).version,
                      int(
                          ipaddress.ip_network(
                              value
                          ).network_address
                      ),
                      ipaddress.ip_network(value).prefixlen,
                  ),
              )

              country_cache[tag] = result
              return result

          def read_cidrs(tag):
              source_file = data_dir / tag

              if source_file.is_file():
                  cidrs = [
                      line.strip()
                      for line in source_file.read_text(
                          encoding="utf-8"
                      ).splitlines()
                      if line.strip()
                      and not line.lstrip().startswith("#")
                  ]
              else:
                  cidrs = extract_country_cidrs(tag)

              if not cidrs:
                  raise FileNotFoundError(
                      "Requested rule-set tag does not exist "
                      f"in data/ and could not be extracted "
                      f"from Country MMDB: {tag}"
                  )

              valid_cidrs = []

              for cidr in cidrs:
                  try:
                      valid_cidrs.append(
                          str(
                              ipaddress.ip_network(
                                  cidr,
                                  strict=False,
                              )
                          )
                      )
                  except ValueError as exc:
                      raise ValueError(
                          f"Invalid CIDR in tag {tag}: {cidr}"
                      ) from exc

              return list(dict.fromkeys(valid_cidrs))

          cidr_cache = {
              tag: read_cidrs(tag)
              for tag in all_tags
          }

          for tag in srs_tags:
              cidrs = cidr_cache[tag]

              source = {
                  "version": 2,
                  "rules": [
                      {
                          "ip_cidr": cidrs
                      }
                  ]
              }

              output_file = srs_source_dir / f"{tag}.json"

              output_file.write_text(
                  json.dumps(
                      source,
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )

              print(
                  f"SRS source: {tag} "
                  f"({len(cidrs)} CIDRs)"
              )

          for tag in mrs_tags:
              cidrs = cidr_cache[tag]

              output_file = mrs_source_dir / f"{tag}.txt"

              output_file.write_text(
                  "\n".join(cidrs) + "\n",
                  encoding="utf-8",
              )

              print(
                  f"MRS source: {tag} "
                  f"({len(cidrs)} CIDRs)"
              )

          for tag in surge_tags:
              cidrs = cidr_cache[tag]
              rules = []

              for cidr in cidrs:
                  network = ipaddress.ip_network(
                      cidr,
                      strict=False,
                  )

                  rule_type = (
                      "IP-CIDR"
                      if network.version == 4
                      else "IP-CIDR6"
                  )

                  rules.append(
                      f"{rule_type},{network}"
                  )

              output_file = surge_source_dir / f"{tag}.list"

              output_file.write_text(
                  "\n".join(rules) + "\n",
                  encoding="utf-8",
              )

              print(
                  f"Surge source: {tag} "
                  f"({len(rules)} rules)"
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"srs_count={len(srs_tags)}\n")
              output.write(f"mrs_count={len(mrs_tags)}\n")
              output.write(
                  f"surge_count={len(surge_tags)}\n"
              )

          print(f"Selected SRS tags: {srs_tags}")
          print(f"Selected MRS tags: {mrs_tags}")
          print(f"Selected Surge tags: {surge_tags}")
          PY

      # ============================================================
      # Build SRS
      # ============================================================

      - name: Install sing-box
        if: steps.rulesets.outputs.srs_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          DOWNLOAD_URL="$(
            python <<'PY'
          import json
          import platform
          import urllib.request

          architecture = platform.machine().lower()

          architecture_map = {
              "x86_64": "linux-amd64",
              "amd64": "linux-amd64",
              "aarch64": "linux-arm64",
              "arm64": "linux-arm64",
          }

          target = architecture_map.get(architecture)

          if not target:
              raise RuntimeError(
                  f"Unsupported architecture: {architecture}"
              )

          request = urllib.request.Request(
              "https://api.github.com/repos/SagerNet/sing-box/releases/latest",
              headers={
                  "User-Agent": "custom-geoip-builder"
              },
          )

          with urllib.request.urlopen(
              request,
              timeout=60,
          ) as response:
              release = json.load(response)

          for asset in release.get("assets", []):
              name = asset.get("name", "")

              if (
                  target in name
                  and name.endswith(".tar.gz")
              ):
                  print(asset["browser_download_url"])
                  break
          else:
              raise RuntimeError(
                  f"Cannot find sing-box asset for {target}"
              )
          PY
          )"

          curl -fL \
            "$DOWNLOAD_URL" \
            -o sing-box.tar.gz

          rm -rf sing-box-extract
          mkdir -p sing-box-extract

          tar -xzf sing-box.tar.gz \
            -C sing-box-extract

          SING_BOX_BINARY="$(
            find sing-box-extract \
              -type f \
              -name sing-box \
              -print \
              -quit
          )"

          if [ -z "$SING_BOX_BINARY" ]; then
            echo "Error: sing-box binary not found."
            exit 1
          fi

          sudo install \
            -m 0755 \
            "$SING_BOX_BINARY" \
            /usr/local/bin/sing-box

          sing-box version

      - name: Compile selected SRS rule sets
        if: steps.rulesets.outputs.srs_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf srs
          mkdir -p srs

          for source_file in ruleset-source/srs/*.json; do
            if [ ! -f "$source_file" ]; then
              continue
            fi

            tag="$(basename "$source_file" .json)"

            sing-box rule-set compile \
              --output "srs/${tag}.srs" \
              "$source_file"

            if [ ! -s "srs/${tag}.srs" ]; then
              echo "Error: failed to generate srs/${tag}.srs"
              exit 1
            fi

            echo "Generated: srs/${tag}.srs"
          done

      # ============================================================
      # Build MRS
      # ============================================================

      - name: Install Mihomo
        if: steps.rulesets.outputs.mrs_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          DOWNLOAD_URL="$(
            python <<'PY'
          import json
          import platform
          import urllib.request

          architecture = platform.machine().lower()

          architecture_map = {
              "x86_64": "linux-amd64",
              "amd64": "linux-amd64",
              "aarch64": "linux-arm64",
              "arm64": "linux-arm64",
          }

          target = architecture_map.get(architecture)

          if not target:
              raise RuntimeError(
                  f"Unsupported architecture: {architecture}"
              )

          request = urllib.request.Request(
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest",
              headers={
                  "User-Agent": "custom-geoip-builder"
              },
          )

          with urllib.request.urlopen(
              request,
              timeout=60,
          ) as response:
              release = json.load(response)

          candidates = []

          for asset in release.get("assets", []):
              name = asset.get("name", "").lower()

              if target not in name:
                  continue

              if not name.endswith(".gz"):
                  continue

              if any(
                  excluded in name
                  for excluded in (
                      "compatible",
                      "go120",
                      "musl",
                      "deb",
                      "rpm",
                  )
              ):
                  continue

              candidates.append(asset)

          if not candidates:
              raise RuntimeError(
                  f"Cannot find Mihomo asset for {target}"
              )

          candidates.sort(
              key=lambda asset: len(asset["name"])
          )

          print(
              candidates[0]["browser_download_url"]
          )
          PY
          )"

          curl -fL \
            "$DOWNLOAD_URL" \
            -o mihomo.gz

          gzip -dc mihomo.gz > mihomo
          chmod +x mihomo

          sudo install \
            -m 0755 \
            mihomo \
            /usr/local/bin/mihomo

          mihomo -v

      - name: Compile selected MRS rule sets
        if: steps.rulesets.outputs.mrs_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf mrs
          mkdir -p mrs

          for source_file in ruleset-source/mrs/*.txt; do
            if [ ! -f "$source_file" ]; then
              continue
            fi

            tag="$(basename "$source_file" .txt)"

            mihomo convert-ruleset \
              ipcidr \
              text \
              "$source_file" \
              "mrs/${tag}.mrs"

            if [ ! -s "mrs/${tag}.mrs" ]; then
              echo "Error: failed to generate mrs/${tag}.mrs"
              exit 1
            fi

            echo "Generated: mrs/${tag}.mrs"
          done

      # ============================================================
      # Build Surge / Shadowrocket lists
      # ============================================================

      - name: Build selected Surge rule sets
        if: steps.rulesets.outputs.surge_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf surge
          mkdir -p surge

          cp ruleset-source/surge/*.list surge/

          for output_file in surge/*.list; do
            if [ ! -s "$output_file" ]; then
              echo "Error: failed to generate $output_file"
              exit 1
            fi

            echo "Generated: $output_file"
          done

      - name: Verify generated rule sets
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SRS="${{ steps.rulesets.outputs.srs_count }}"
          EXPECTED_MRS="${{ steps.rulesets.outputs.mrs_count }}"
          EXPECTED_SURGE="${{ steps.rulesets.outputs.surge_count }}"

          ACTUAL_SRS=0
          ACTUAL_MRS=0
          ACTUAL_SURGE=0

          if [ -d "srs" ]; then
            ACTUAL_SRS="$(
              find srs \
                -maxdepth 1 \
                -type f \
                -name '*.srs' \
                | wc -l
            )"
          fi

          if [ -d "mrs" ]; then
            ACTUAL_MRS="$(
              find mrs \
                -maxdepth 1 \
                -type f \
                -name '*.mrs' \
                | wc -l
            )"
          fi

          if [ -d "surge" ]; then
            ACTUAL_SURGE="$(
              find surge \
                -maxdepth 1 \
                -type f \
                -name '*.list' \
                | wc -l
            )"
          fi

          echo "SRS: ${ACTUAL_SRS}/${EXPECTED_SRS}"
          echo "MRS: ${ACTUAL_MRS}/${EXPECTED_MRS}"
          echo "Surge: ${ACTUAL_SURGE}/${EXPECTED_SURGE}"

          if [ "$ACTUAL_SRS" -ne "$EXPECTED_SRS" ]; then
            echo "Error: SRS output count mismatch."
            exit 1
          fi

          if [ "$ACTUAL_MRS" -ne "$EXPECTED_MRS" ]; then
            echo "Error: MRS output count mismatch."
            exit 1
          fi

          if [ "$ACTUAL_SURGE" -ne "$EXPECTED_SURGE" ]; then
            echo "Error: Surge output count mismatch."
            exit 1
          fi

          find srs mrs surge \
            -maxdepth 1 \
            -type f \
            -print 2>/dev/null \
            | sort || true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          rm -f rulesets.sha256sum

          find srs mrs surge \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.srs' \
              -o -name '*.mrs' \
              -o -name '*.list' \
            \) \
            -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r sha256sum \
            > rulesets.sha256sum

          if [ ! -s "rulesets.sha256sum" ]; then
            echo "No SRS, MRS or Surge files configured." \
              > rulesets.sha256sum
          fi

          cat rulesets.sha256sum

      # ============================================================
      # Release
      # ============================================================

      - name: Publish generated files to release branch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf publish

          git fetch origin \
            refs/heads/release:refs/remotes/origin/release

          git worktree add \
            --detach \
            publish \
            refs/remotes/origin/release

          find publish \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          mkdir -p publish/srs
          mkdir -p publish/mrs
          mkdir -p publish/surge

          cp geoip.dat publish/
          cp geoip.dat.sha256sum publish/
          cp rulesets.sha256sum publish/

          if [ -d srs ]; then
            find srs \
              -maxdepth 1 \
              -type f \
              -name '*.srs' \
              -exec cp {} publish/srs/ \;
          fi

          if [ -d mrs ]; then
            find mrs \
              -maxdepth 1 \
              -type f \
              -name '*.mrs' \
              -exec cp {} publish/mrs/ \;
          fi

          if [ -d surge ]; then
            find surge \
              -maxdepth 1 \
              -type f \
              -name '*.list' \
              -exec cp {} publish/surge/ \;
          fi

          cd publish

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Release branch already contains the latest files."
          else
            git commit \
              -m "Update generated rules ${{ steps.time.outputs.TIMESTAMP }}"

            git push origin HEAD:refs/heads/release
          fi

      - name: Release files with timestamp
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.time.outputs.TIMESTAMP }}
          name: ${{ steps.time.outputs.TIMESTAMP }}
          body: |
            Auto-built custom GeoIP, SRS, MRS and Surge rule-set files.

            Build time: ${{ steps.time.outputs.TIMESTAMP }} HKT
          draft: false
          prerelease: false
          make_latest: false
          files: |
            geoip.dat
            geoip.dat.sha256sum
            rulesets.sha256sum
            srs/*.srs
            mrs/*.mrs
            surge/*.list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update fixed release tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: Latest Release
          body: |
            Always contains the latest custom GeoIP, SRS, MRS and Surge rule-set files.

            Build time: ${{ steps.time.outputs.TIMESTAMP }} HKT
          draft: false
          prerelease: false
          make_latest: true
          files: |
            geoip.dat
            geoip.dat.sha256sum
            rulesets.sha256sum
            srs/*.srs
            mrs/*.mrs
            surge/*.list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
