name: Build Custom geoip.dat

on:
  push:
    branches:
      - main
      - master

  schedule:
    - cron: "0 20 * * *" # 每日香港時間 04:00

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-custom-geoip
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install maxminddb

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: false

      - name: Get current timestamp (HKT)
        id: time
        shell: bash
        run: |
          set -euo pipefail

          echo "TIMESTAMP=$(TZ='Asia/Hong_Kong' date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Process and Extract IP Rules
        shell: bash
        run: |
          set -euo pipefail

          python convert.py

          if [ ! -d "data" ]; then
            echo "Error: convert.py did not create data directory."
            exit 1
          fi

          if [ -z "$(find data -maxdepth 1 -type f -print -quit)" ]; then
            echo "Error: no IP rule files were generated inside data."
            exit 1
          fi

          echo "Generated text rule files:"
          find data -maxdepth 1 -type f -print | sort

          echo "Generated Country MMDB files:"
          find . -maxdepth 1 -type f -name 'base-*.mmdb' -print | sort

      - name: Clone v2fly geoip compiler
        shell: bash
        run: |
          set -euo pipefail

          rm -rf compiler

          git clone \
            --depth 1 \
            https://github.com/v2fly/geoip.git \
            compiler

          echo "Compiler commit:"
          git -C compiler rev-parse HEAD

      - name: Copy source files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf compiler/data
          rm -rf compiler/mmdb

          cp -r data compiler/data
          mkdir -p compiler/mmdb

          MMDB_COUNT=0

          for mmdb_file in base-*.mmdb; do
            if [ ! -f "$mmdb_file" ]; then
              continue
            fi

            cp "$mmdb_file" compiler/mmdb/

            MMDB_COUNT=$((MMDB_COUNT + 1))

            echo "Copied Country MMDB: $mmdb_file"
          done

          echo "Total Country MMDB files copied: $MMDB_COUNT"

          if [ "$MMDB_COUNT" -eq 0 ]; then
            echo "Warning: no Country MMDB files were configured."
          fi

          echo "Compiler text inputs:"
          find compiler/data \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo "Compiler MMDB inputs:"
          find compiler/mmdb \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      - name: Create v2fly compiler config
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import glob
          import json
          import os

          inputs = []

          mmdb_files = sorted(
              glob.glob("compiler/mmdb/base-*.mmdb")
          )

          for mmdb_file in mmdb_files:
              relative_path = "./" + os.path.relpath(
                  mmdb_file,
                  start="compiler",
              ).replace("\\", "/")

              inputs.append({
                  "type": "maxmindMMDB",
                  "action": "add",
                  "args": {
                      "uri": relative_path
                  }
              })

          inputs.append({
              "type": "text",
              "action": "add",
              "args": {
                  "inputDir": "./data"
              }
          })

          compiler_config = {
              "input": inputs,
              "output": [
                  {
                      "type": "v2rayGeoIPDat",
                      "action": "output",
                      "args": {
                          "outputDir": "./output",
                          "outputName": "geoip.dat"
                      }
                  }
              ]
          }

          with open(
              "compiler/custom-config.json",
              "w",
              encoding="utf-8",
          ) as config_file:
              json.dump(
                  compiler_config,
                  config_file,
                  ensure_ascii=False,
                  indent=2,
              )

          print(
              f"Added {len(mmdb_files)} "
              "Country MMDB files."
          )
          PY

          echo "Compiler config:"
          cat compiler/custom-config.json

      - name: Compile and merge geoip.dat
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail

          rm -rf output
          mkdir -p output

          go mod download
          go run ./ -c custom-config.json

          if [ ! -f "output/geoip.dat" ]; then
            echo "Error: output/geoip.dat was not generated."

            find . \
              -maxdepth 3 \
              -type f \
              -print

            exit 1
          fi

          if [ ! -s "output/geoip.dat" ]; then
            echo "Error: output/geoip.dat is empty."
            exit 1
          fi

          mv output/geoip.dat ../geoip.dat

      - name: Verify geoip.dat
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "geoip.dat" ]; then
            echo "Error: geoip.dat does not exist."
            exit 1
          fi

          if [ ! -s "geoip.dat" ]; then
            echo "Error: geoip.dat is empty."
            exit 1
          fi

          echo "Generated geoip.dat:"
          ls -lh geoip.dat

          sha256sum geoip.dat \
            | tee geoip.dat.sha256sum

      - name: Release geoip.dat with timestamp
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.time.outputs.TIMESTAMP }}
          name: ${{ steps.time.outputs.TIMESTAMP }}
          body: |
            Auto-built custom geoip.dat.

            Build time: ${{ steps.time.outputs.TIMESTAMP }} HKT
          draft: false
          prerelease: false
          make_latest: false
          files: |
            geoip.dat
            geoip.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update fixed release tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: Latest Release
          body: |
            Always contains the latest custom geoip.dat.

            Build time: ${{ steps.time.outputs.TIMESTAMP }} HKT
          draft: false
          prerelease: false
          make_latest: true
          files: |
            geoip.dat
            geoip.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
