name: Build Custom geoip.dat

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 20 * * *'  # 每天香港時間 04:00 自動更新
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Get current timestamp (HKT)
        id: time
        run: |
          echo "TIMESTAMP=$(TZ='Asia/Hong_Kong' date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Process & Extract IP Rules (Python)
        run: python convert.py

      - name: Compile and Merge with Base MMDB using v2fly Tool
        run: |
          git clone --depth 1 https://github.com/v2fly/geoip.git compiler
          
          # 將自訂 data/ 資料夾複製到編譯器目錄
          cp -r data compiler/
          
          cd compiler
          
          # 如果存在 base.mmdb，則將其作為 maxminddb 輸入，並覆蓋疊加 data/ 目錄下的自訂 IP
          if [ -f "../base.mmdb" ]; then
            cp ../base.mmdb ./base.mmdb
            cat << 'EOF' > config.json
{
  "input": [
    {
      "type": "maxminddb",
      "action": "add",
      "args": {
        "uri": "./base.mmdb"
      }
    },
    {
      "type": "v2rayCustom",
      "action": "add",
      "args": {
        "dir": "./data"
      }
    }
  ],
  "output": [
    {
      "type": "v2rayGeoIPDat",
      "action": "output",
      "args": {
        "outputName": "geoip.dat",
        "outputDir": "./output"
      }
    }
  ]
}
EOF
          else
            cat << 'EOF' > config.json
{
  "input": [
    {
      "type": "v2rayCustom",
      "action": "add",
      "args": {
        "dir": "./data"
      }
    }
  ],
  "output": [
    {
      "type": "v2rayGeoIPDat",
      "action": "output",
      "args": {
        "outputName": "geoip.dat",
        "outputDir": "./output"
      }
    }
  ]
}
EOF
          fi
          
          # 執行官方編譯器 (讀取自動生成的 config.json)
          go run ./
          
          if [ -f "output/geoip.dat" ]; then
            mv output/geoip.dat ../geoip.dat
            sha256sum ../geoip.dat | awk '{print $1}' > ../geoip.dat.sha256sum
          fi

      # 1. 建立獨立時間戳記 Release (例如 Tag: 20260802161231)
      - name: Release geoip.dat (Timestamp)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.time.outputs.TIMESTAMP }}
          name: "${{ steps.time.outputs.TIMESTAMP }}"
          body: "Auto-built geoip.dat at ${{ steps.time.outputs.TIMESTAMP }}"
          draft: false
          prerelease: false
          files: |
            geoip.dat
            geoip.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 同時更新固定 Latest Tag (release)
      - name: Update Latest Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: "Latest Release"
          body: |
            Always contains the latest custom geoip.dat.
            
            Build time: ${{ steps.time.outputs.TIMESTAMP }} HKT
          draft: false
          prerelease: false
          files: |
            geoip.dat
            geoip.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
